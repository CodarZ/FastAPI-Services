[project]
name = "fastapi-services"
version = "0.0.0"
description = "FastAPI Services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "cryptography>=50.0.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "flower>=2.1.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "msgspec>=0.21.1",
    "pwdlib[argon2]>=0.3.1",
    "py-ip2region>=3.0.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pyrate-limiter>=4.4.0",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "user-agents>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgres]>=4.9.0",
]
lint = [
    "commitizen>=4.18.0",
    "prek>=0.4.14",
    "ruff>=0.16.4",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.fastapi]
entrypoint = "backend.main:app"

[tool.uv]
package = false
python-downloads = "manual"
default-groups = ["dev", "lint"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
